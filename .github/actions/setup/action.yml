name: Setup workspace
description: Corepack → Node·Yarn 캐시 → 의존성 설치(변조 가드는 호출하는 workflow가 먼저 실행)

runs:
  using: composite
  steps:
    # setup-node의 yarn 캐시가 Yarn 4를 찾도록 Corepack 선활성화
    - shell: bash
      run: corepack enable

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

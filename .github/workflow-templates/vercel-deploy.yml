name: Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to deploy
        required: true
        type: choice
        options: [web, admin]
      environment:
        description: Vercel environment
        required: true
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable

      - name: Select Vercel project
        shell: bash
        run: |
          case "${{ inputs.app }}" in
            web) echo 'VERCEL_PROJECT_ID=${{ secrets.VERCEL_WEB_PROJECT_ID }}' >> "$GITHUB_ENV" ;;
            admin) echo 'VERCEL_PROJECT_ID=${{ secrets.VERCEL_ADMIN_PROJECT_ID }}' >> "$GITHUB_ENV" ;;
          esac

      - name: Verify deployment secrets
        shell: bash
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        working-directory: apps/${{ inputs.app }}
        run: yarn dlx vercel@latest pull --yes --environment=${{ inputs.environment }} --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        working-directory: apps/${{ inputs.app }}
        run: yarn dlx vercel@latest build ${{ inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy Vercel output
        working-directory: apps/${{ inputs.app }}
        run: yarn dlx vercel@latest deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 의존성 설치(코드가 실행될 수 있는 단계) 전에 변조 징후를 먼저 검사한다.
      - name: Suspicious file guard
        run: node turbo/workflows/check-suspicious.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify

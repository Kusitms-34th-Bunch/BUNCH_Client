name: Mobile E2E

# 앱 쉘 핵심 흐름을 iOS 시뮬레이터에서 Maestro로 확인(결정 기록 029)
# macOS 러너가 무거워 PR마다가 아니라 쉘·bridge·쉘을 부르는 웹 코드가 바뀐 develop push와 수동 실행에서만 돎
on:
  push:
    branches: [develop]
    paths:
      - 'apps/mobile-shell/**'
      - 'packages/bridge/**'
      # 쉘을 부르는 웹 쪽(탭 바·탭 동기화)과 flow가 판정에 쓰는 가짜 서버 데이터
      - 'apps/web/src/shared/bridge/**'
      - 'apps/web/src/features/main-navigation/**'
      - 'apps/web/src/shared/query/nativeTabSync.ts'
      - 'apps/web/src/mocks/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro (iOS)
    runs-on: macos-26
    # 캐시가 없는 첫 실행은 iOS 빌드만 약 20분이라 flow까지 60분을 넘겨 취소됐음(2026-11-23). 캐시가 맞으면 훨씬 짧음
    timeout-minutes: 120
    env:
      # setup-node의 pnpm 캐시 조회가 저장소 루트(packageManager: yarn)에서 돌아도 Corepack이 막지 않도록
      COREPACK_ENABLE_STRICT: '0'
      # Maestro CLI는 버전과 SHA-256을 고정해 받음(설치 스크립트를 실행하지 않음)
      MAESTRO_VERSION: '2.12.1'
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
      WEB_URL: http://127.0.0.1:3200
      # 드라이버 시작 대기의 최대치(ms). 부팅은 아래에서 빌드와 겹쳐 끝내고, 이 값은 느린 러너의 안전 상한
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 의존성 설치(코드가 실행될 수 있는 단계) 전 변조 징후 선검사
      - name: 변조 가드
        run: node turbo/workflows/check-suspicious.mjs

      # 빌드할 SDK와 같은 iOS 런타임의 iPhone 17 Pro(로컬 확인 기기)를 먼저, 없으면 같은 런타임의 다른 iPhone
      # 첫 부팅은 데이터 이전으로 2분 넘게 걸려(2026-11-22 실패) 빌드(약 20분)와 겹치게 맨 앞에서 부팅만 시작
      - name: 시뮬레이터 부팅 시작
        # flow를 두 대에 나눠 돌림(flow마다 앱을 새로 켜는 시간이 길어 한 대로는 flow 합이 약 16분, 2026-11-26 실행)
        # 두 번째는 첫 기기와 같은 기종으로 만들어 화면 크기를 맞추고, 빌드와 자원을 나누지 않게 빌드 뒤에 부팅
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          picked=$(xcrun simctl list devices available -j | SDK="$sdk" node -e '
            const { devices } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const runtime = `iOS-${process.env.SDK.replaceAll(".", "-")}`;
            const [runtimeId, list = []] = Object.entries(devices).find(([key]) => key.endsWith(runtime)) ?? [];
            const phones = list.filter((device) => device.name.startsWith("iPhone"));
            const phone = phones.find((device) => device.name === "iPhone 17 Pro") ?? phones[0];
            if (!phone) {
              console.error(`${runtime} 런타임의 iPhone 시뮬레이터가 없어요`);
              process.exit(1);
            }
            console.log([phone.udid, phone.deviceTypeIdentifier, runtimeId].join(" "));
          ')
          read -r udid device_type runtime_id <<< "$picked"
          second=$(xcrun simctl create "E2E shard 2" "$device_type" "$runtime_id")
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "SECOND_SIMULATOR_UDID=$second" >> "$GITHUB_ENV"

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      # 운영 데이터를 건드리지 않게 가짜 서버(MSW)를 켠 웹 운영 빌드(Playwright E2E와 같은 방식). 가짜 DB는 로그인·가입 완료 상태로 시작
      - name: 웹 빌드(가짜 서버)
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
          SENTRY_AUTH_TOKEN: ''
          NEXT_PUBLIC_SENTRY_DSN: ''
        run: yarn workspace @app/web build

      - name: 웹 띄우기
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
        run: |
          nohup yarn workspace @app/web exec next start --hostname 127.0.0.1 --port 3200 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "$WEB_URL" > /dev/null && exit 0
            sleep 2
          done
          echo "웹이 뜨지 않았어요" && cat "$RUNNER_TEMP/web.log" && exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile-shell/pnpm-lock.yaml

      - name: 쉘 의존성 설치
        working-directory: apps/mobile-shell
        env:
          SENTRYCLI_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # 네이티브 지문(app.json·네이티브 패키지·modules/*): 같으면 ios/(Pods 포함)를 그대로 쓰고 생성 단계를 건너뜀
      - name: 네이티브 지문
        id: fingerprint
        working-directory: apps/mobile-shell
        run: |
          hash=$(node -e "require(require.resolve('@expo/fingerprint', { paths: [require.resolve('expo/package.json')] })).createFingerprintAsync('.').then((f) => console.log(f.hash))")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          # ios/.xcode.env.local에 node 절대 경로가 들어가 Node가 바뀌면 다른 캐시로(지문에는 Node 버전이 없음)
          echo "node=$(node -v)" >> "$GITHUB_OUTPUT"

      - name: iOS 네이티브 프로젝트 캐시
        id: ios-cache
        uses: actions/cache@v5
        with:
          path: apps/mobile-shell/ios
          key: e2e-ios-${{ runner.os }}-${{ steps.fingerprint.outputs.node }}-${{ steps.fingerprint.outputs.hash }}

      # 빌드 중간 결과(e2e-ios-build.mjs의 derivedDataPath). 지문이 달라도 최근 것으로 증분 빌드(JS만 바뀌면 묶기만 다시)
      # 키는 지문 단위로만(실행마다 수 GB를 새로 저장해 저장소 캐시 한도를 채우지 않게)
      - name: iOS 빌드 중간 결과 캐시
        uses: actions/cache@v5
        with:
          path: apps/mobile-shell/build/e2e
          key: e2e-derived-${{ runner.os }}-${{ steps.fingerprint.outputs.node }}-${{ steps.fingerprint.outputs.hash }}
          restore-keys: e2e-derived-${{ runner.os }}-${{ steps.fingerprint.outputs.node }}-

      - name: CocoaPods 캐시
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('apps/mobile-shell/pnpm-lock.yaml', 'apps/mobile-shell/app.json') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: iOS 네이티브 프로젝트 생성
        if: steps.ios-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile-shell
        run: pnpm ios:sync:clean

      - name: iOS 시뮬레이터 Release 빌드(E2E)
        working-directory: apps/mobile-shell
        env:
          E2E_WEB_URL: ${{ env.WEB_URL }}
        run: node scripts/e2e-ios-build.mjs

      # 앞에서 시작한 부팅이 끝났는지 확인(보통 빌드 동안 끝나 바로 지나감)
      - name: 시뮬레이터 준비·앱 설치
        run: |
          xcrun simctl boot "$SECOND_SIMULATOR_UDID"
          for udid in "$SIMULATOR_UDID" "$SECOND_SIMULATOR_UDID"; do
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" apps/mobile-shell/build/e2e/Build/Products/Release-iphonesimulator/Bunch.app
          done

      # Maestro CLI가 쓰는 Java(러너 기본값에 기대지 않음)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Maestro 설치
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro 실행
        id: maestro
        working-directory: apps/mobile-shell
        run: |
          # 빌드 동안 웹이 죽었으면 flow 실패 대신 원인을 바로 보이게
          curl -sf "$WEB_URL" > /dev/null || { echo "웹이 응답하지 않아요" && cat "$RUNNER_TEMP/web.log" && exit 1; }
          maestro --device "$SIMULATOR_UDID,$SECOND_SIMULATOR_UDID" test --shard-split 2 --format junit --output "$RUNNER_TEMP/maestro-report.xml" --test-output-dir "$RUNNER_TEMP/maestro-output" maestro

      - name: 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-results
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-output
            ${{ runner.temp }}/web.log
          if-no-files-found: ignore

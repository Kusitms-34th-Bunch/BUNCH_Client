name: Discord PR Notify

# 열림·재오픈·리뷰 준비 알림은 제목이 확정된 뒤 보내려고 pr-metadata.yml의 notify job에서 보낸다.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}

    steps:
      - name: Send notification
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL is not configured; skipping.'
            exit 0
          fi

          jq -n \
            --arg content "✅ PR merged: [#$PR_NUMBER $PR_TITLE]($PR_URL) by @$PR_AUTHOR" \
            '{content: $content}' |
            curl --fail-with-body --connect-timeout 10 --max-time 30 --request POST "$DISCORD_WEBHOOK_URL" \
              --header 'Content-Type: application/json' \
              --data @-

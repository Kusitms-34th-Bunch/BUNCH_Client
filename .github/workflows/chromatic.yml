name: Chromatic

on:
  push:
    # tags-ignore만 정의하면 브랜치 push가 실행되지 않으므로 branches를 정의한다(태그 push는 실행하지 않음)
    branches: ['**']
    paths:
      - 'packages/design-system/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.github/workflows/chromatic.yml'

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  publish:
    name: Visual Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      # 토큰 미전달 실행(Dependabot, 미등록)의 이후 단계 스킵
      - name: Check Chromatic configuration
        id: chromatic
        run: echo "enabled=${{ env.CHROMATIC_PROJECT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.chromatic.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # 설치 전 변조 징후 선검사
      - name: Suspicious file guard
        if: steps.chromatic.outputs.enabled == 'true'
        run: node turbo/workflows/check-suspicious.mjs

      # setup-node의 yarn 캐시가 Yarn 4를 찾도록 Corepack 선활성화
      - if: steps.chromatic.outputs.enabled == 'true'
        run: corepack enable

      - uses: actions/setup-node@v4
        if: steps.chromatic.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: yarn

      - if: steps.chromatic.outputs.enabled == 'true'
        run: yarn install --immutable
      - if: steps.chromatic.outputs.enabled == 'true'
        run: yarn workspace @app/design-system build-storybook --stats-json

      - if: steps.chromatic.outputs.enabled == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: packages/design-system/storybook-static
          # TurboSnap: 바뀐 모듈에 닿는 story만 찍는다. 모노레포라서 Storybook 기준 폴더를 알려 준다
          onlyChanged: true
          storybookBaseDir: packages/design-system
          storybookConfigDir: packages/design-system/.storybook
          # tokens.css는 storybook.css가 @import해서 의존 그래프에 별도 모듈로 잡히지 않으므로 바뀌면 전체를 다시 찍는다
          externals: |
            packages/design-system/tokens/*.css

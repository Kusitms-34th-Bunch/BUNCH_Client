name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 엔진별로 러너를 나눠 동시에 돌림(한 job에서 차례로 돌리면 web spec이 두 번이라 시간이 두 배)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            projects: --project=admin-chromium --project=web-chromium
          - name: webkit
            projects: --project=web-webkit
    # 브라우저·시스템 라이브러리·글꼴이 든 Playwright 공식 이미지에서 실행해 매번 설치하지 않음
    # 태그는 @playwright/test(.yarnrc.yml catalog) 버전과 같아야 함(다르면 브라우저 실행 파일을 못 찾아 실패)
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      # 이미지에 든 Node·Yarn 1.x가 아니라 setup-node·Corepack 버전이 잡혔는지 로그로 확인
      - run: node --version && yarn --version

      - run: yarn install --immutable

      # 가짜 서버 웹 빌드의 Next 캐시. 같은 PR의 다음 push부터 컴파일을 이어 받음(E2E는 PR에서만 돌아 첫 실행은 캐시 없음)
      - uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: e2e-next-${{ matrix.name }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: e2e-next-${{ matrix.name }}-${{ hashFiles('yarn.lock') }}-
      # 타입 검사는 엔진과 무관해 한 job에서만
      - if: matrix.name == 'chromium'
        run: yarn e2e:typecheck
      - run: yarn e2e ${{ matrix.projects }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.name }}
          path: test-results
          if-no-files-found: ignore

name: Sync Design Tokens

on:
  push:
    branches: [design-token]
    paths:
      - packages/design-system/tokens/tokens.json
  workflow_dispatch:

concurrency:
  group: sync-design-tokens
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 비밀 없음: 의존성 설치·저장소 스크립트는 이 job에서만 실행(공급망 코드가 토큰에 닿지 않게)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design-token
          persist-credentials: false

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Suspicious file guard
        run: node turbo/workflows/check-suspicious.mjs

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Convert and verify tokens
        run: |
          yarn tokens:build
          yarn tokens:check
          yarn workspace @app/design-system test scripts/tokens.test.ts

      # 게시 job에는 생성 CSS 한 파일만 넘김
      - uses: actions/upload-artifact@v6
        with:
          name: design-tokens-css
          path: packages/design-system/tokens/tokens.css
          if-no-files-found: error
          retention-days: 1

  # 비밀 있음: 설치·저장소 스크립트를 실행하지 않고 받은 CSS만 커밋·push·PR
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check automation token
        env:
          PR_TOKEN: ${{ secrets.DESIGN_TOKENS_PR_TOKEN }}
        run: |
          if [ -z "$PR_TOKEN" ]; then
            echo "Set DESIGN_TOKENS_PR_TOKEN with Contents and Pull requests read/write access to this repository."
            exit 1
          fi

      # PAT-authenticated pushes and PRs allow their CI workflows to run without bot approval.
      # 변환 job이 검사한 커밋 그대로(그 사이 design-token이 움직였으면 아래 push가 fast-forward로 실패). 토큰은 .git에 남기지 않음
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: design-tokens-css
          path: ${{ runner.temp }}/design-tokens

      # 받은 것이 일반 파일 하나이고 크기가 정상일 때만 그 경로에 둠
      - name: Place generated CSS
        run: |
          dir="$RUNNER_TEMP/design-tokens"
          file="$dir/tokens.css"
          if [ "$(find "$dir" -mindepth 1 | wc -l)" -ne 1 ] || [ ! -f "$file" ] || [ -L "$file" ]; then
            echo "Artifact must contain only tokens.css as a regular file."
            exit 1
          fi
          size=$(stat -c %s "$file")
          if [ "$size" -eq 0 ] || [ "$size" -gt 1048576 ]; then
            echo "Unexpected tokens.css size: $size bytes."
            exit 1
          fi
          # 받는 자리가 링크면 runner의 다른 파일(예: ~/.gitconfig)을 덮을 수 있어 멈춤
          if [ -L packages/design-system/tokens/tokens.css ]; then
            echo "packages/design-system/tokens/tokens.css must not be a symlink."
            exit 1
          fi
          cp "$file" packages/design-system/tokens/tokens.css

      - name: Commit generated CSS
        env:
          PR_TOKEN: ${{ secrets.DESIGN_TOKENS_PR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/design-system/tokens/tokens.css
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore: 디자인 토큰 자동 변환"
            git -c core.hooksPath=/dev/null -c credential.helper= push "https://x-access-token:${PR_TOKEN}@github.com/${{ github.repository }}.git" HEAD:design-token
          fi

      - name: Open a PR to develop when needed
        env:
          GH_TOKEN: ${{ secrets.DESIGN_TOKENS_PR_TOKEN }}
        run: |
          # checkout(fetch-depth: 0)이 모든 브랜치를 받아 두어 origin/develop이 있음(인증 없는 fetch 불필요)
          if git diff --quiet origin/develop HEAD -- packages/design-system/tokens/tokens.json packages/design-system/tokens/tokens.css; then
            echo "No design token changes compared with develop."
            exit 0
          fi
          OPEN_PR=$(gh pr list --base develop --head design-token --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Updated existing design-token PR #$OPEN_PR."
            exit 0
          fi
          cat > "$RUNNER_TEMP/design-token-pr.md" <<'BODY'
          ## ✨ 주요 변경사항

          - Tokens Studio에서 전달된 디자인 토큰 원본과 생성 CSS를 반영합니다.

          ---

          ## 📝 작업 상세 내용

          - Primitive·Semantic 계층과 CSS 변수 참조를 유지합니다.
          - 색상·간격·radius·shadow·타이포그래피를 변환합니다.

          ---

          ## 🧪 검증

          - `yarn tokens:build`, `yarn tokens:check`
          - `yarn workspace @app/design-system test scripts/tokens.test.ts`

          ---

          ## 👀 리뷰 포인트

          - 디자인 의도와 토큰 이름·값이 일치하는지 확인해주세요.

          ---

          ## ✅ 체크리스트

          - [ ] 관련 이슈 `Close #번호` 작성
          - [ ] 불필요한 주석 및 디버깅 코드 제거
          - [ ] 기능 정상 동작 확인
          - [ ] 커밋 및 코드 컨벤션 준수
          - [ ] 코드 리뷰 지적에 모두 응답 (고침 / 안 고치는 이유 / 이슈 번호)

          ---

          ## 📸 스크린샷 (선택)

          UI 변경이 있는 경우 리뷰 시 첨부합니다.

          ---

          ## ⚠️ 리스크 / 후속 작업

          - 앱 화면과 실제 폰트 렌더링은 별도 확인이 필요합니다.

          ---

          ## 🔗 관련 이슈

          연결할 이슈가 있으면 리뷰 시 추가합니다.
          BODY
          gh pr create --base develop --head design-token \
            --title "[Chore] 디자인 토큰 업데이트" \
            --body-file "$RUNNER_TEMP/design-token-pr.md"

name: Create Work Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  # 공개 저장소라 누구나 이슈를 열 수 있어, 저장소 쓰기 권한(write 이상)이 있는 사람이 연 이슈만 브랜치를 만듦
  # author_association은 org 멤버십을 비공개로 둔 팀원을 CONTRIBUTOR·NONE으로 보내 걸러질 수 있어 권한을 직접 조회
  authorize:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission || echo none)
          case "$permission" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "쓰기 권한이 없는 작성자($permission)라 브랜치를 만들지 않습니다."; echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  create:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Parse issue metadata
        id: work
        env:
          WORK_ITEM_MODE: issue
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/parse_issue.py

      # 기준 브랜치는 만들 원본으로만 씀(스크립트는 위에서 checkout한 default branch의 것)
      - name: Resolve base branch
        id: base
        if: steps.work.outputs.matched == 'true'
        env:
          REQUESTED_BASE: ${{ steps.work.outputs.base_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE_REF="${REQUESTED_BASE:-$DEFAULT_BRANCH}"
          echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          # 없음(exit 2)만 안내하고, 원격 조회 오류는 step 실패로 남김
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$BASE_REF" > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          # 정확히 그 이름을 받음(ls-remote는 이름 뒷부분만 맞아도 통과). checkout이 만든 ref보다 앞서 있어도 덮어씀
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Apply issue metadata
        id: metadata
        if: steps.work.outputs.matched == 'true' && steps.base.outputs.found == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_TITLE: ${{ steps.work.outputs.issue_title }}
          LABEL_NAME: ${{ steps.work.outputs.label }}
          LABEL_COLOR: ${{ steps.work.outputs.label_color }}
          LABEL_DESCRIPTION: ${{ steps.work.outputs.label_description }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: process.env.LABEL_NAME });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: process.env.LABEL_NAME,
                color: process.env.LABEL_COLOR,
                description: process.env.LABEL_DESCRIPTION,
              });
            }

            const { data: issue } = await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              title: process.env.ISSUE_TITLE,
              assignees: [context.payload.issue.user.login],
              labels: [process.env.LABEL_NAME],
            });

            core.setOutput('title', issue.title);
            core.setOutput('assignees', issue.assignees.map(({ login }) => `@${login}`).join(', '));

      - name: Create branch
        id: branch
        if: steps.work.outputs.matched == 'true' && steps.base.outputs.found == 'true'
        env:
          BRANCH_NAME: ${{ steps.work.outputs.branch_name }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "refs/remotes/origin/$BASE_REF:refs/heads/$BRANCH_NAME"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Share branch name
        if: steps.work.outputs.matched == 'true' && steps.base.outputs.found == 'true'
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ steps.work.outputs.branch_name }}
          BASE_BRANCH: ${{ steps.base.outputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CREATED: ${{ steps.branch.outputs.created }}
        with:
          script: |
            const { BRANCH_NAME, BASE_BRANCH, DEFAULT_BRANCH, CREATED } = process.env;
            // 다른 작업 브랜치 위에 만들었으면 PR base 안내(스택 PR)
            const stacked =
              BASE_BRANCH === DEFAULT_BRANCH
                ? []
                : [
                    '',
                    `PR을 올릴 때 base를 \`${BASE_BRANCH}\`로 두세요. 기준 PR이 먼저 머지되면 이 PR의 base를 \`${DEFAULT_BRANCH}\`로 바꿉니다.`,
                  ];

            const body = [
              CREATED === 'true' ? '작업 브랜치를 생성했습니다.' : '작업 브랜치가 이미 있습니다.',
              '',
              `- 브랜치: \`${BRANCH_NAME}\``,
              `- 기준: \`${BASE_BRANCH}\``,
              '',
              '```bash',
              'git status --short',
              'git fetch origin',
              `git switch ${BRANCH_NAME}`,
              '```',
              ...stacked,
              '',
              '단일 작업은 이 브랜치에서 진행합니다.',
              '다른 작업과 분리해야 하면 별도 worktree에 연결하세요(`docs/workflows/development.md`의 "worktree를 만드는 기준").',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Send issue notification
        if: steps.work.outputs.matched == 'true' && steps.base.outputs.found == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ steps.metadata.outputs.title }}
          ISSUE_ASSIGNEES: ${{ steps.metadata.outputs.assignees }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL is not configured; skipping.'
            exit 0
          fi

          jq -n \
            --arg content "🆕 이슈 생성: [#$ISSUE_NUMBER $ISSUE_TITLE]($ISSUE_URL)
          담당자: $ISSUE_ASSIGNEES · 작성자: @$ISSUE_AUTHOR" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail-with-body --connect-timeout 10 --max-time 30 --request POST "$DISCORD_WEBHOOK_URL" \
              --header 'Content-Type: application/json' \
              --data @-

      # 예: 기준 브랜치가 workflow 파일을 바꿨으면 GITHUB_TOKEN(workflows 권한 없음)으로는 push가 거부될 수 있음
      - name: Report branch creation failure
        if: failure() && steps.work.outputs.matched == 'true' && (steps.base.outcome == 'failure' || steps.branch.outcome == 'failure')
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ steps.work.outputs.branch_name }}
          BASE_BRANCH: ${{ steps.base.outputs.ref }}
          BASE_FAILED: ${{ steps.base.outcome == 'failure' }}
        with:
          script: |
            const { BRANCH_NAME, BASE_BRANCH, BASE_FAILED } = process.env;
            // 기준 브랜치를 받지 못함(조회 오류, 정확히 그 이름이 없음)
            const body =
              BASE_FAILED === 'true'
                ? [
                    `작업 브랜치를 만들지 못했습니다. 기준 브랜치 \`${BASE_BRANCH}\`를 받지 못했습니다(workflow 로그 확인).`,
                    '',
                    '기준 브랜치 이름이 원격 브랜치와 정확히 같은지 확인해 주세요. 이 이슈를 닫고 이슈 폼으로 새 이슈를 만들어 주세요.',
                  ]
                : [
                    `작업 브랜치 \`${BRANCH_NAME}\`를 \`${BASE_BRANCH}\`에서 만들지 못했습니다(workflow 로그 확인).`,
                    '',
                    '기준 브랜치가 `.github/workflows/`를 바꿨다면 자동으로 만들 수 없을 수 있습니다. 아래 명령으로 직접 만들어 주세요.',
                    '',
                    '```bash',
                    'git fetch origin',
                    `git switch -c ${BRANCH_NAME} origin/${BASE_BRANCH}`,
                    `git push -u origin ${BRANCH_NAME}`,
                    '```',
                  ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n'),
            });

      - name: Report missing base branch
        if: steps.work.outputs.matched == 'true' && steps.base.outputs.found != 'true'
        uses: actions/github-script@v8
        env:
          BASE_BRANCH: ${{ steps.base.outputs.ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `작업 브랜치를 만들지 못했습니다. 기준 브랜치 \`${process.env.BASE_BRANCH}\`가 원격 저장소에 없습니다.`,
                '',
                '기준 브랜치를 push했는지, 이름이 맞는지 확인해 주세요.',
                '이 workflow는 이슈를 열 때만 실행되므로 이 이슈를 닫고 이슈 폼으로 새 이슈를 만들어 주세요.',
              ].join('\n'),
            });
            core.setFailed('기준 브랜치가 원격 저장소에 없습니다.');

      - name: Report invalid issue form
        if: steps.work.outputs.matched != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '작업 브랜치를 만들지 못했습니다. 이슈 제목과 아래 폼 값을 확인해 주세요.',
                '',
                '- 이슈 제목: `[작업]` 뒤에 실제 작업 제목을 입력해 주세요.',
                '- `브랜치 이름`: 비어 있지 않아야 합니다.',
                '- `작업 타입`: 이슈 폼의 선택지에서 골라 주세요(`feat`, `fix`, `hotfix`, `refactor`, `remove`, `rename`, `style`, `test`, `docs`, `chore`).',
                '- `기준 브랜치 (선택)`: 비우거나 원격에 있는 작업 브랜치 이름(예: `381-feat/bundle-place-pin-api`)을 입력해 주세요. `main`은 쓸 수 없습니다.',
                '',
                '이 workflow는 이슈를 열 때만 실행되므로 내용을 고쳐도 다시 실행되지 않습니다. 이 이슈를 닫고 이슈 폼으로 새 이슈를 만들어 주세요.',
              ].join('\n'),
            });
            core.setFailed('이슈 제목 또는 브랜치 이름·작업 타입·기준 브랜치가 유효하지 않습니다.');

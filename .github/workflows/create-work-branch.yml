name: Create Work Branch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Parse issue metadata
        id: work
        env:
          WORK_ITEM_MODE: issue
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/parse_issue.py

      - name: Apply issue metadata
        id: metadata
        if: steps.work.outputs.matched == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.work.outputs.issue_title }}
          LABEL_NAME: ${{ steps.work.outputs.label }}
          LABEL_COLOR: ${{ steps.work.outputs.label_color }}
          LABEL_DESCRIPTION: ${{ steps.work.outputs.label_description }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: process.env.LABEL_NAME });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: process.env.LABEL_NAME,
                color: process.env.LABEL_COLOR,
                description: process.env.LABEL_DESCRIPTION,
              });
            }

            const { data: issue } = await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              title: process.env.ISSUE_TITLE,
              assignees: [context.payload.issue.user.login],
              labels: [process.env.LABEL_NAME],
            });

            core.setOutput('title', issue.title);
            core.setOutput('assignees', issue.assignees.map(({ login }) => `@${login}`).join(', '));

      - name: Create branch
        id: branch
        if: steps.work.outputs.matched == 'true'
        env:
          BRANCH_NAME: ${{ steps.work.outputs.branch_name }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Share branch name
        if: steps.work.outputs.matched == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.work.outputs.branch_name }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CREATED: ${{ steps.branch.outputs.created }}
        with:
          script: |
            const { BRANCH_NAME, BASE_BRANCH, CREATED } = process.env;

            const body = [
              CREATED === 'true' ? '작업 브랜치를 만들었습니다.' : '작업 브랜치가 이미 있습니다.',
              '',
              `- 브랜치: \`${BRANCH_NAME}\``,
              `- 기준: \`${BASE_BRANCH}\``,
              '',
              '```bash',
              'git status --short',
              'git fetch origin',
              `git switch ${BRANCH_NAME}`,
              '```',
              '',
              '단일 작업은 위 feature 브랜치에서 진행합니다. 다른 작업의 변경이나 실행 중 세션을 보존해야 하면 이 브랜치를 별도 worktree에 연결합니다.',
              '변경을 자동으로 옮기거나 stash하지 않습니다. 작업 위치와 병렬 세션 기준은 `docs/workflows/development.md`의 "worktree를 만드는 기준"을 따릅니다.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Send issue notification
        if: steps.work.outputs.matched == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ steps.metadata.outputs.title }}
          ISSUE_ASSIGNEES: ${{ steps.metadata.outputs.assignees }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'DISCORD_WEBHOOK_URL is not configured; skipping.'
            exit 0
          fi

          jq -n \
            --arg content "🆕 이슈 생성: [#$ISSUE_NUMBER $ISSUE_TITLE]($ISSUE_URL)
          담당자: $ISSUE_ASSIGNEES · 작성자: @$ISSUE_AUTHOR" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail-with-body --connect-timeout 10 --max-time 30 --request POST "$DISCORD_WEBHOOK_URL" \
              --header 'Content-Type: application/json' \
              --data @-

      - name: Report invalid issue form
        if: steps.work.outputs.matched != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '작업 브랜치를 만들지 못했습니다. 이슈 제목과 아래 폼 값을 확인해 주세요.',
                '',
                '- 이슈 제목: `[작업]` 뒤에 실제 작업 제목을 입력해 주세요.',
                '- `브랜치 이름`: 비어 있지 않아야 합니다.',
                '- `작업 타입`: 이슈 폼의 선택지에서 골라 주세요(`feat`, `fix`, `hotfix`, `refactor`, `remove`, `rename`, `style`, `test`, `docs`, `chore`).',
                '',
                '이 workflow는 이슈를 열 때만 실행되므로 내용을 고쳐도 다시 실행되지 않습니다. 이 이슈를 닫고 이슈 폼으로 새 이슈를 만들어 주세요.',
              ].join('\n'),
            });
            core.setFailed('이슈 제목 또는 브랜치 이름·작업 타입이 유효하지 않습니다.');

# gitleaks 기본 규칙에 저장소 예외만 추가(security.yml이 저장소 루트의 이 파일을 자동으로 읽음)
[extend]
useDefault = true

# 문서의 `Token: bg-surface-brand-subtle-2` 같은 Tailwind 클래스를 generic-api-key가 키로 오인
# Markdown 파일에서 소문자 kebab 형태(하이픈 2개 이상) 값만 제외
[[allowlists]]
description = "문서의 Tailwind 디자인 토큰 클래스"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''\.md$''']
regexes = ['''^[a-z]+(?:-[a-z0-9]+){2,}$''']

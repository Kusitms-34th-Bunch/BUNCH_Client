appId: kr.bunch.app
name: 번치 탭을 두 번 누르면 최근 번치로 바뀌고, 다시 두 번 누르면 돌아온다
---
# 시스템 탭 바의 다시 누름(nativeTabReselect)이 두 번 오는지는 쉘에서만 확인됨(#518)
# 가짜 DB는 「여행쥬아」에서 시작, 최근 사용순 두 번째가 「퇴근런클럽」
- runFlow: ../subflows/launch-fresh.yaml
# 앱 시작 직후 첫 입력이 무시될 수 있어(QA 2차 F-3) 바뀔 때까지 다시 두 번 누름
- repeat:
    while:
      notVisible: '퇴근런클럽'
    times: 5
    commands:
      - doubleTapOn:
          text: '번치'
          # 탭 화면도 같은 이름이라(화면 전체) 탭 바 안의 버튼만 고름(#534)
          childOf:
            text: 'Tab Bar'
      - waitForAnimationToEnd
# 시트 없이 바로 바뀌고 전환 토스트로 실제로 바뀌었는지 확인
- extendedWaitUntil:
    visible: '퇴근런클럽 번치로 전환했어요.*'
    timeout: 30000
- assertNotVisible: '번치 전환하기'
# 그 뒤 입력은 한 번에 동작해야 함(재시도 없음). 앞 토스트가 사라진 뒤 누름
- extendedWaitUntil:
    notVisible: '퇴근런클럽 번치로 전환했어요.*'
    timeout: 15000
- doubleTapOn:
    text: '번치'
    # 탭 화면도 같은 이름이라(화면 전체) 탭 바 안의 버튼만 고름(#534)
    childOf:
      text: 'Tab Bar'
- extendedWaitUntil:
    visible: '여행쥬아 번치로 전환했어요.*'
    timeout: 30000
- assertVisible: '마이페이지'

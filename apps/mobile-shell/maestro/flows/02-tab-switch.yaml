appId: kr.bunch.app
name: 탭을 바꾸면 그 탭 화면이 보이고 탭 바가 남는다
---
- runFlow: ../subflows/launch-fresh.yaml
# 앱 시작 직후 첫 입력만 재시도(flows/90-startup-first-input.yaml), 그 뒤 전환은 한 번 눌러 바뀌어야 함
# 탭을 처음 열면 그 탭 WebView가 페이지를 새로 받아 CI에서 10초를 넘겨 상한은 30초
- runFlow:
    file: ../subflows/tap-tab-until-visible.yaml
    env:
      TAB_ID: 'tab-photos'
      MARK: '사진 올리기'
- tapOn:
    # 탭 화면도 탭 이름과 같은 이름이라 탭 바 버튼의 식별자로 고름(시뮬레이터 언어와 무관, #534)
    id: 'tab-feed'
- extendedWaitUntil:
    visible: 'BUNCH, 맨 위로'
    timeout: 30000
- tapOn:
    # 탭 화면도 탭 이름과 같은 이름이라 탭 바 버튼의 식별자로 고름(시뮬레이터 언어와 무관, #534)
    id: 'tab-my'
- extendedWaitUntil:
    visible: '로그아웃'
    timeout: 30000
- tapOn:
    # 탭 화면도 탭 이름과 같은 이름이라 탭 바 버튼의 식별자로 고름(시뮬레이터 언어와 무관, #534)
    id: 'tab-bunch'
- extendedWaitUntil:
    visible: '콕한 장소'
    timeout: 30000
- assertVisible: '마이페이지'

appId: kr.bunch.app
name: 백그라운드에 뒀다 돌아오면 보던 탭 화면과 탭 바가 그대로다
---
- runFlow: ../subflows/launch-fresh.yaml
- runFlow:
    file: ../subflows/tap-until-visible.yaml
    env:
      TARGET: '사진함'
      MARK: '사진 올리기'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: '사진 올리기'
    timeout: 15000
- assertVisible: '마이페이지'

appId: kr.bunch.app
name: 앱 시작 직후 처음 누른 탭과 버튼이 바로 동작한다
# 지금은 시작 직후 한동안 탭 바와 웹 버튼 입력이 모두 무시됨(QA 2차 F-3). 고치면 known-issue 태그를 지워 CI에 넣음
tags:
  - known-issue
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn: '콕한 장소'
- extendedWaitUntil:
    visible: '멤버 필터'
    timeout: 3000
- runFlow: ../subflows/launch-fresh.yaml
- tapOn: '사진함'
- extendedWaitUntil:
    visible: '사진 올리기'
    timeout: 3000

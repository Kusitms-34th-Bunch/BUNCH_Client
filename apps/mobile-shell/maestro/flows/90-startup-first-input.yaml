appId: kr.bunch.app
name: 앱 시작 직후 처음 누른 탭과 버튼이 바로 동작한다
# 스플래시 덮개가 사라지는 동안 입력을 먹던 문제(QA 2차 F-3, #520). 덮는 동안 아래 화면은 숨겨져, 덮개가 흐려지기 시작한 뒤 누름
---
- runFlow: ../subflows/launch-fresh.yaml
- tapOn: '콕한 장소'
- extendedWaitUntil:
    visible: '멤버 필터'
    timeout: 3000
- runFlow: ../subflows/launch-fresh.yaml
- tapOn:
    text: '사진함'
    # 탭 화면도 같은 이름이라(화면 전체) 탭 바 안의 버튼만 고름(#534)
    childOf:
      text: 'Tab Bar'
# 처음 보이는 탭 WebView는 CI 시뮬레이터에서 그리기가 늦어(5초 걸린 기록) 넉넉히. 입력이 무시되면 상한과 상관없이 실패
- extendedWaitUntil:
    visible: '사진 올리기'
    timeout: 10000

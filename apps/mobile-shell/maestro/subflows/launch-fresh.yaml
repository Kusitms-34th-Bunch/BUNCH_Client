# 저장된 상태 없이 실행하고 번치 홈이 그려질 때까지 기다림(가짜 DB는 로그인·가입 완료 상태로 시작)
# CI 시뮬레이터는 실행만 약 50초라 상한을 넉넉히(결정 기록 029)
appId: kr.bunch.app
---
- launchApp:
    clearState: true
    # 알림 권한을 미리 허용(웹이 묻는 시스템 창이 앱 화면을 덮으면 Maestro가 그 아래 요소를 찾지 못함)
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: '콕한 장소'
    timeout: 120000

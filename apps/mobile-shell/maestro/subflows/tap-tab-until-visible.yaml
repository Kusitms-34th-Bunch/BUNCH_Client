# 탭 바 버튼(식별자 tab-<id>)을 누르고 그 탭 화면의 표식이 보일 때까지 다시 누름
# tap-until-visible과 같지만 탭 화면도 탭 이름과 같은 이름이라 식별자로 고름(#534)
appId: kr.bunch.app
---
- repeat:
    while:
      notVisible: ${MARK}
    times: 5
    commands:
      # 앞 탭이 먹고 다음 화면을 기다리는 중이면 누를 대상이 없어도 넘어감
      - tapOn:
          id: ${TAB_ID}
          optional: true
      - waitForAnimationToEnd
# 탭을 처음 여는 경우 CI에서 로딩이 10초를 넘어 30초까지 기다림(결정 기록 029)
- extendedWaitUntil:
    visible: ${MARK}
    timeout: 30000
